name: "Bug report / 缺陷报告"
description: "Report a reproducible defect in the package, verifier, or demo. / 报告可复现的问题。"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Please remove secrets, tokens, personal data, and private evidence before posting.

        感谢反馈。提交前请删除密钥、Token、个人信息和未公开证据。

  - type: checkboxes
    id: safety-check
    attributes:
      label: "Safety check / 安全检查"
      options:
        - label: "I confirmed that this issue contains no secrets or sensitive personal data. / 我确认本 Issue 不包含密钥或敏感个人信息。"
          required: true

  - type: dropdown
    id: version
    attributes:
      label: "Version / 版本"
      description: "Select the closest version or branch. / 选择最接近的版本或分支。"
      options:
        - "v1.0.3 development branch"
        - "v1.0.2"
        - "Other / 其他"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment / 环境"
      description: "For example: Windows 11, PowerShell 5.1, Python 3.12. / 例如：Windows 11、PowerShell 5.1、Python 3.12。"
      placeholder: "Windows 11 / PowerShell 5.1 / Python 3.12"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / 复现步骤"
      description: "Give the smallest reliable sequence of actions. / 提供最短且稳定的复现步骤。"
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior / 预期结果"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior / 实际结果"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Sanitized logs / 已脱敏日志"
      description: "Paste only the minimum sanitized output needed to diagnose the issue. / 只粘贴诊断所需的最少脱敏输出。"
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context / 补充信息"
